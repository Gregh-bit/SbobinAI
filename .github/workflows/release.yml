name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            rust_targets: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles dmg,app'
          - platform: windows-latest
            rust_targets: ''
            args: '--bundles nsis,msi'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: 'SbobinAI ${{ github.ref_name }}'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Ad-hoc codesign app bundle (macOS)
        if: matrix.platform == 'macos-14'
        run: |
          for app in $(find frontend/src-tauri/target -name "SbobinAI.app" -type d); do
            echo "Signing $app ad-hoc..."
            codesign --force --deep --sign - "$app"
          done

      - name: Upload fixed-name asset for direct website download (macOS)
        if: matrix.platform == 'macos-14'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME=$(gh release list --limit 1 | awk '{print $1}')
          fi
          DMG_FILE=$(find frontend/src-tauri/target -name "*.dmg" | head -n 1)
          if [ -n "$DMG_FILE" ] && [ -n "$TAG_NAME" ]; then
            cp "$DMG_FILE" SbobinAI-macOS.dmg
            gh release upload "$TAG_NAME" SbobinAI-macOS.dmg --clobber
          fi

      - name: Upload fixed-name asset for direct website download (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ github.ref_type == 'tag' && github.ref_name || '' }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME=$(gh release list --limit 1 | awk '{print $1}')
          fi
          # Seleziona prioritariamente l'installer NSIS (-setup.exe), non il binario raw privo di installer
          EXE_FILE=$(find frontend/src-tauri/target -type f -name "*setup*.exe" | head -n 1)
          if [ -z "$EXE_FILE" ]; then
            EXE_FILE=$(find frontend/src-tauri/target/release/bundle -type f -name "*.exe" | head -n 1)
          fi
          if [ -z "$EXE_FILE" ]; then
            EXE_FILE=$(find frontend/src-tauri/target -type f -name "*.exe" | head -n 1)
          fi
          if [ -n "$EXE_FILE" ] && [ -n "$TAG_NAME" ]; then
            cp "$EXE_FILE" SbobinAI-Windows.exe
            gh release upload "$TAG_NAME" SbobinAI-Windows.exe --clobber
          fi
